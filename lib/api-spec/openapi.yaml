            application/json:
              schema:
                $ref: "#/components/schemas/ToggleUserActiveResponse"

  /eggs:
    get:
      operationId: listEggProductions
      tags: [eggs]
      summary: List egg production records
      security:
        - bearerAuth: []
      parameters:
        - name: batchId
          in: query
          schema:
            type: string
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of egg production records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EggProductionListResponse"
    post:
      operationId: createEggProduction
      tags: [eggs]
      summary: Create an egg production record
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEggProductionRequest"
      responses:
        "201":
          description: Egg production record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EggProduction"

  /eggs/{eggId}:
    put:
      operationId: updateEggProduction
      tags: [eggs]
      summary: Update an egg production record
      security:
        - bearerAuth: []
      parameters:
        - name: eggId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEggProductionRequest"
      responses:
        "200":
          description: Egg production record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EggProduction"
    delete:
      operationId: deleteEggProduction
      tags: [eggs]
      summary: Delete an egg production record
      security:
        - bearerAuth: []
      parameters:
        - name: eggId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Egg production record deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"

  /analytics:
    get:
      operationId: getAnalytics
      tags: [analytics]
      summary: Get analytics data
      security:
        - bearerAuth: []
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Analytics data
          content:
            application/json:
